modules:
  jira:issuePanel:
    - key: test-gene-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: test-gene
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/react-ts/dist
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/49c2b208-c354-4225-b22c-5b83f7ff701d
